[package]
name = "yomiscript-ja-accent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "OpenJTalk's Japanese front end (jpreprocess) as WebAssembly, for the dictionary accent of @yomiscript/ja-accent"

[lib]
crate-type = ["cdylib"]

[dependencies]
# the dictionary files are built by the same jpreprocess version (see ../README.md)
jpreprocess = { version = "=0.15.0", default-features = false, features = ["tokenizer"] }
lindera-dictionary = { version = "~3.0.7", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
