<!doctype html><meta charset=utf-8><title>YomiScript demo</title>
<style>body{font:15px sans-serif;max-width:820px;margin:2em auto}textarea{width:100%;height:7em;font:16px monospace}</style>
<h2>YomiScript → Yomite → Katarite (Kokoro, browser)</h2>
<select id=p></select> pitch: <select id=pm><option value=rules>Yomite rules</option><option value=kokoro>Kokoro prediction</option></select> <button id=go disabled>Play</button> <span id=st>loading models…</span>
<textarea id=t></textarea>
<div>YomiScript with pitch values (what the Katarite renders):</div><textarea id=r readonly></textarea><audio id=a controls></audio>
<script src="ort/ort.webgpu.min.js"></script>
<script type=module>
import * as Y from './ys.js';import {realize} from './yomite.js';import {KokoroProsody} from './kokoro_prosody.js';
ort.env.wasm.wasmPaths=new URL('ort/',location.href).href;ort.env.wasm.numThreads=crossOriginIsolated?(+new URLSearchParams(location.search).get('t')||Math.min(4,navigator.hardwareConcurrency||1)):1;
Y.setData(await (await fetch('data.json')).json());
const P=await (await fetch('presets.json')).json(),sel=document.getElementById('p'),t=document.getElementById('t'),st=document.getElementById('st'),go=document.getElementById('go');
P.forEach(x=>sel.add(new Option(x.name,x.ys)));sel.onchange=()=>t.value=sel.value;t.value=P[0].ys;
const E=new Y.Engine(ort,async p=>{const b=await (await fetch(p)).arrayBuffer();return p.endsWith('.bin')?b:new Uint8Array(b)});
const Q=new URLSearchParams(location.search),M=Q.get('m')||'w16',EP=Q.get('ep')||'wasm';
const SUF={fp32:{},w16:{enc:'_w16',f0n:'_w16',dec:'_w16'},i8:{dec:'_i8gemm'},c16:{enc:'_w16',f0n:'_w16',dec:'_c16'}}[M];
if(EP==='webgpu'&&!navigator.gpu)throw st.textContent='webgpu unavailable';
await E.init({suffix:SUF,ep:EP});const KP=new KokoroProsody(E),pm=document.getElementById('pm'),r=document.getElementById('r');if(Q.get('pitch'))pm.value=Q.get('pitch');st.textContent='ready';window.__info={M,EP,threads:ort.env.wasm.numThreads,coi:crossOriginIsolated};go.disabled=false;
go.onclick=async()=>{go.disabled=true;st.textContent='synthesizing…';const t0=performance.now();
 try{const ys=pm.value==='kokoro'?await KP.realize(t.value):realize(t.value);r.value=ys;const {audio}=await E.synth(ys);const u=URL.createObjectURL(new Blob([Y.wav(audio)],{type:'audio/wav'}));
 const a=document.getElementById('a');a.src=u;a.play().catch(()=>{});st.textContent=`done ${(audio.length/24000).toFixed(2)}s audio in ${((performance.now()-t0)/1000).toFixed(1)}s`;window.__len=audio.length}
 catch(e){st.textContent='error: '+e;window.__err=String(e)}go.disabled=false};
</script>
